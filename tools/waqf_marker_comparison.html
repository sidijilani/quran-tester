<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compact fa and filled lozenge · page 504</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#302d29;font:15px/1.5 system-ui}main{max-width:1500px;margin:24px auto;padding:0 24px}h1{font-size:24px;font-weight:500;margin:0 0 6px}p{margin:0;color:#686158}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 24px}.colors{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;color:inherit;background:#f8f6f0;border:1px solid #d5cfc3;border-radius:6px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{border-color:#61554b;box-shadow:0 0 0 1px #61554b}button:focus-visible,input:focus-visible{outline:2px solid #873d50;outline-offset:3px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.slider{display:flex;align-items:center;gap:8px}input[type=range]{width:130px;accent-color:#873d50}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}figure{margin:0;min-width:0}figcaption{display:flex;align-items:center;gap:12px;margin-bottom:12px}h2{font-size:18px;font-weight:500;margin:0}figcaption p{font-size:13px}.sample{width:36px;height:36px;flex:none;color:var(--marker-ink)}.page{position:relative;line-height:0;background:#fff;box-shadow:0 6px 22px #38362712}.page img{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;width:100%;height:100%;color:var(--marker-ink)}.marker{fill:currentColor}.details{margin:20px 0;font-size:13px;color:#686158}.details span[lang=ar]{font-family:'Geeza Pro',serif;font-size:20px;color:#302d29}#comparisonRoot{--marker-ink:#873d50}@media(max-width:800px){main{padding:0 12px;margin:18px auto}.comparison{grid-template-columns:1fr;gap:26px}.toolbar{gap:12px}h1{font-size:21px}}
</style>
<main id="comparisonRoot">
  <h1>Al-Ahqaf · page 504</h1>
  <p>The same three supplemental stops, with two marker designs.</p>
  <div class="toolbar">
    <div class="colors" role="group" aria-label="Marker color">
      <button type="button" data-color="#873d50" aria-pressed="true"><span class="swatch" style="background:#873d50"></span>Burgundy · recommended</button>
      <button type="button" data-color="#40362f" aria-pressed="false"><span class="swatch" style="background:#40362f"></span>Warm ink</button>
      <button type="button" data-color="#947039" aria-pressed="false"><span class="swatch" style="background:#947039"></span>Bronze</button>
    </div>
    <label class="slider" for="markerSize">Size <output id="sizeValue">17</output><input id="markerSize" type="range" min="12" max="24" value="17"></label>
    <label><input id="showMarkers" type="checkbox" checked> Show markers</label>
  </div>
  <div class="comparison" id="pageComparison">
    <figure data-design="fa">
      <figcaption><svg class="sample" viewBox="0 0 100 100" aria-hidden="true"><use href="#compactFa" x="5" y="5" width="90" height="90"/></svg><div><h2>2 · Compact fa</h2><p>Calligraphic letter</p></div></figcaption>
      <div class="page" id="faPage"><img src="../../assets/pages/504.jpg" alt="Hafs Quran page 504, compact fa markers after سنة, والديّ and ما عملوا"><svg class="overlay" aria-label="Compact fa supplemental markers"></svg></div>
    </figure>
    <figure data-design="lozenge">
      <figcaption><svg class="sample" viewBox="0 0 100 100" aria-hidden="true"><use href="#filledLozenge" x="15" y="0" width="70" height="70"/><line x1="50" y1="69" x2="50" y2="96" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg><div><h2>4 · Filled lozenge</h2><p>With a fine word divider</p></div></figcaption>
      <div class="page" id="lozengePage"><img src="../../assets/pages/504.jpg" alt="Hafs Quran page 504, filled lozenge markers after سنة, والديّ and ما عملوا"><svg class="overlay" aria-label="Filled lozenge supplemental markers"></svg></div>
    </figure>
  </div>
  <p class="details">After <span lang="ar" dir="rtl">سَنَةً</span>, <span lang="ar" dir="rtl">وَالِدَيَّ</span>, and <span lang="ar" dir="rtl">مَا عَمِلُوا</span> · PDF page 500, rows 4, 5 and 8.</p>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
    <!-- Pen-shaped outlines keep the proposed fa independent of installed fonts. -->
    <symbol id="compactFa" viewBox="0 0 100 100">
      <path fill="currentColor" fill-rule="evenodd" d="M81 33 C72 33 64 44 66 53 C67 62 77 66 86 62 C80 75 57 80 37 79 C18 78 8 71 9 59 C9 55 11 49 15 43 C12 59 22 66 40 67 C57 68 74 64 84 56 C73 59 69 56 71 50 C73 44 79 42 82 47 C84 50 86 56 86 61 C94 50 90 34 81 33 Z M73 51 C74 47 80 45 82 49 C79 52 76 53 73 51 Z"/>
      <path fill="currentColor" d="M70 18 L79 10 L89 18 L80 27 Z"/>
    </symbol>
    <symbol id="filledLozenge" viewBox="0 0 100 100">
      <path fill="currentColor" d="M50 7 C45 24 33 39 15 50 C33 61 45 76 50 93 C55 76 67 61 85 50 C67 39 55 24 50 7 Z"/>
    </symbol>
  </defs></svg>
</main>
<script>
(() => {
  const example=__EXAMPLE__, ns='http://www.w3.org/2000/svg', root=document.getElementById('comparisonRoot');
  const uses=[];
  root.querySelectorAll('figure[data-design]').forEach(figure=>{
    const svg=figure.querySelector('.overlay'), design=figure.dataset.design;
    svg.setAttribute('viewBox',`0 0 ${example.imageWidth} ${example.imageHeight}`);
    example.markers.forEach(marker=>{
      const group=document.createElementNS(ns,'g'), use=document.createElementNS(ns,'use'), title=document.createElementNS(ns,'title');
      group.classList.add('marker'); group.setAttribute('role','img');
      group.setAttribute('aria-label',`Supplemental stop after ${marker.matchedText}, ${marker.ref}`);
      title.textContent=`${marker.matchedText} · ${marker.ref} · PDF row ${marker.source.row}`;
      use.setAttribute('href',design==='fa'?'#compactFa':'#filledLozenge');
      const divider=design==='lozenge'?document.createElementNS(ns,'line'):null;
      if(divider){
        divider.setAttribute('stroke','currentColor'); divider.setAttribute('stroke-width','1');
        divider.setAttribute('stroke-linecap','round'); divider.setAttribute('opacity','0.75');
      }
      // Offset in native page pixels, so the lower placement scales with the page.
      uses.push({use,marker,divider,offsetY:design==='lozenge'?7:0}); group.append(title,use);
      if(divider)group.append(divider); svg.append(group);
    });
  });
  function resize(size){
    document.getElementById('sizeValue').textContent=size;
    uses.forEach(({use,marker,divider,offsetY})=>{
      use.setAttribute('x',marker.x*example.imageWidth-size/2);
      use.setAttribute('y',marker.y*example.imageHeight-size+offsetY);
      use.setAttribute('width',size); use.setAttribute('height',size);
      if(divider){
        const x=marker.x*example.imageWidth;
        const top=marker.y*example.imageHeight+offsetY-size*0.07+2;
        const bottom=(marker.wordBox.y+marker.wordBox.h)*example.imageHeight-4;
        divider.setAttribute('x1',x); divider.setAttribute('x2',x);
        divider.setAttribute('y1',top); divider.setAttribute('y2',Math.max(top,bottom));
      }
    });
  }
  resize(17);
  document.getElementById('markerSize').addEventListener('input',e=>resize(Number(e.target.value)));
  root.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>{
    root.style.setProperty('--marker-ink',button.dataset.color);
    root.querySelectorAll('[data-color]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
  }));
  document.getElementById('showMarkers').addEventListener('change',e=>root.querySelectorAll('.overlay').forEach(svg=>svg.style.visibility=e.target.checked?'visible':'hidden'));
})();
</script>
</html>
