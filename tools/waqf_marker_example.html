<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#282c29;font:15px/1.6 system-ui}main{max-width:1120px;margin:28px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:24px;line-height:1.3;margin:0 0 6px;font-weight:600}header p{margin:0;color:#6c7169}.prototype{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#626c5b;background:#e3e7dd;border:1px solid #cbd3c1;padding:5px 10px;border-radius:20px}.workspace{display:grid;grid-template-columns:minmax(0,720px) 280px;gap:28px;align-items:start}.page-image{position:relative;line-height:0;background:#fff;box-shadow:0 12px 40px #38362718;container-type:inline-size}.page-image img{display:block;width:100%;height:auto}.page-image svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.marker{font-family:'Geeza Pro','Noto Naskh Arabic','Times New Roman',serif;fill:#9a2841;text-anchor:middle;paint-order:stroke;stroke:#fffdf7;stroke-width:1px;cursor:help}.marker:focus{outline:none;fill:#641d2b}.panel{background:#f8f6f0;border:1px solid #ddd8ca;border-radius:12px;padding:20px;position:sticky;top:20px}.legend{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd8ca;padding-bottom:16px;margin-bottom:18px}.legend .glyph{font:34px 'Geeza Pro','Times New Roman',serif;color:#9a2841}.legend p{margin:0;font-size:13px;color:#61675d}.controls{margin:20px 0}label{display:block;font-size:13px;margin:14px 0}input[type=range]{width:100%;accent-color:#9a2841}input[type=checkbox]{accent-color:#9a2841;margin-right:8px}.entry{padding:14px 0;border-top:1px solid #e3dfd3}.entry .arabic{font:27px/1.6 'Geeza Pro','Times New Roman',serif;direction:rtl}.entry p{font-size:12px;color:#666d60;margin:4px 0}.note{font-size:12px;color:#71786b;margin-top:16px}@media(max-width:850px){main{padding:0 12px;margin:18px auto}.workspace{grid-template-columns:1fr}.panel{position:static}header{align-items:flex-start}h1{font-size:2 <main><header><div><h1>Al-Ahqaf · page 504</h1><p>Three supplemental stops from the PDF</p></div><span class="prototype">Placement example</span></header><div class="workspace"><div class="page-image" id="pageImage"><img src="../../assets/pages/504.jpg" alt="Hafs mushaf page 504"><svg id="markerLayer" aria-label="Three supplemental fa stop markers"></svg></div><aside class="panel"><div class="legend"><span class="glyph" lang="ar">ف</span><div><strong>Supplemental stop</strong><p>Permitted out of necessity;<br>continuing preferred.</p></div></div><div class="controls"><label><input id="visible" type="checkbox" checked>Show added markers</label><label for="size">Marker size <span id="sizeValue">18</span></label><input id="size" type="range" min="12" max="26" value="18"></div><div id="entries"></div><p class="note">PDF page 500, rows 4, 5 and 8. The small ف appears above the end of the word. Hover or focus a marker for its reference.</p></aside></div></main>
<script>
const example=__EXAMPLE__,ns='http://www.w3.org/2000/svg';const svg=document.getElementById('markerLayer');svg.setAttribute('viewBox',`0 0 ${example.imageWidth} ${example.imageHeight}`);
example.markers.forEach(marker=>{const text=document.createElementNS(ns,'text');text.classList.add('marker');text.setAttribute('x',marker.x*example.imageWidth);text.setAttribute('y',marker.y*example.imageHeight);text.setAttribute('font-size','18');text.setAttribute('tabindex','0');text.setAttribute('aria-label',`Supplemental fa stop after ${marker.matchedText}, ${marker.ref}`);text.dataset.sourceRow=marker.source.row;const title=document.createElementNS(ns,'title');title.textContent=`${marker.matchedText} · ${marker.ref} · PDF row ${marker.source.row}`;text.append(title,document.createTextNode(marker.symbol));svg.append(text);const entry=document.createElement('div');entry.className='entry';const phrase=document.createElement('div');phrase.className='arabic';phrase.lang='ar';phrase.textContent=marker.matchedText;const detail=document.createElement('p');detail.textContent=`${marker.ref} · PDF row ${marker.source.row}`;entry.append(phrase,detail);document.getElementById('entries').append(entry)});
document.getElementById('visible').onchange=e=>{svg.style.visibility=e.target.checked?'visible':'hidden'};
document.getElementById('size').oninput=e=>{document.getElementById('sizeValue').textContent=e.target.value;svg.querySelectorAll('.marker').forEach(m=>m.setAttribute('font-size',e.target.value))};
</script></html>
